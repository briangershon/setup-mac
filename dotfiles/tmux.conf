# change prefix to Ctrl-a
set -g prefix C-a
unbind C-b

# pi
set -g extended-keys always
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"

# setup vi bindings
set-window-option -g mode-keys vi
# NOTE: In tmux, type `list-keys -T copy-mode-vi` to see all key bindings
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
set -s copy-command 'pbcopy'

# forward Ctrl-a for beginning of line; Ctrl-e works without the prefix
bind a send-prefix
unbind e

# retain more output and forward focus changes to applications
set -g history-limit 50000
set -s focus-events on

# reduce default delay (to more responsive for Vim, etc)
set -sg escape-time 1

# start window and pane indexes at 1 instead of 0
set -g base-index 1
setw -g pane-base-index 1

# setup reload configuration
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# pressing Ctrl-a, Ctrl-a forwards Ctrl-a to the program running in a pane
bind C-a send-prefix

# open splits and windows in the active pane's directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# mouse scrolling, pane selection, and resizing
set -g mouse on

#if-shell 'test "$(uname)" = "Darwin"' 'source ~/dotfiles/tmux-osx.conf'

# Style
gray_light="#D8DEE9"
gray_medium="#ABB2BF"
gray_dark="#3B4252"
green_soft="#A3BE8C"
blue_muted="#81A1C1"
cyan_soft="#88C0D0"

#set -g status-position top
set -g status-left-length 100
set -g status-style "fg=${gray_light},bg=default"
set -g status-left "#[bold]#[fg=${green_soft}]  #S #[fg=${gray_light},nobold] | "
# set -g status-right " #{cpu}   #{mem}  󱛟 #{disk -f}  󱊣 #{battery} "
set -g status-right ""
set -g window-status-current-format "#[fg=${cyan_soft},bold]  #[underscore]#I:#W#[nounderscore]#{?window_zoomed_flag, 󰍋 ,}"
set -g window-status-format " #I:#W"
set -g message-style "fg=${gray_light},bg=default"
set -g mode-style "fg=${gray_dark},bg=${blue_muted}"
set -g pane-border-style "fg=${gray_dark}"
set -g pane-active-border-style "fg=${green_soft}"
